spring.application.name=transfer-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transfer_db}
spring.datasource.username=${DB_USERNAME:transfer_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
# Request yang menunggu kunci akun terlalu lama dibatalkan, tidak menggantung
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=transfer-service
app.jwt.expiration=15m

app.rate-limit.transfer.capacity=20
app.rate-limit.transfer.period=1m
app.rate-limit.login.capacity=5
app.rate-limit.login.period=1m
