spring:
  application:
    name: transfer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transfer_db}
    username: ${DB_USERNAME:transfer_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      # Request yang menunggu kunci akun terlalu lama dibatalkan, tidak menggantung
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: transfer-service
    expiration: 15m
  rate-limit:
    transfer:
      capacity: 20
      period: 1m
    login:
      capacity: 5
      period: 1m
